deeplinkSpecs:
  - name: "open profile"
    description: "opens user's profile page"
    activity: com.aouledissa.deepmatch.sample.MainActivity
    categories: [DEFAULT, BROWSABLE]
    scheme: [app, https]
    host: ["sample.deepmatch.dev"]
    pathParams:
      - name: profile
      - name: userId
        type: alphanumeric
    queryParams:
      - name: ref
        type: string
        required: true
    fragment: "details"

  - name: "open series"
    activity: com.aouledissa.deepmatch.sample.MainActivity
    categories: [DEFAULT, BROWSABLE]
    scheme: [app]
    host: ["sample.deepmatch.dev"]
    pathParams:
      - name: series
      - name: seriesId
        type: numeric
    queryParams:
      - name: ref
        type: string

  - name: "open hostless profile"
    activity: com.aouledissa.deepmatch.sample.MainActivity
    categories: [DEFAULT, BROWSABLE]
    scheme: [app]
    pathParams:
      - name: profile
      - name: profileId
        type: numeric

  - name: "open about"
    activity: com.aouledissa.deepmatch.sample.MainActivity
    categories: [DEFAULT, BROWSABLE]
    scheme: [app]
    host: ["sample.deepmatch.dev"]
    pathParams:
      - name: about

  - name: "open user posts"
    activity: com.aouledissa.deepmatch.sample.MainActivity
    categories: [DEFAULT, BROWSABLE]
    scheme: [app]
    host: ["sample.deepmatch.dev"]
    pathParams:
      - name: users
      - name: userId
        type: numeric
      - name: posts

  - name: "play episode"
    description: "play episode from url"
    activity: com.aouledissa.deepmatch.sample.MainActivity
    categories: [DEFAULT, BROWSABLE]
    scheme: [https]
    host: ["www.sample.com"]
    pathParams:
      - name: play
      - name: series
        type: alphanumeric
      - name: episodeSlug
        type: alphanumeric
    queryParams:
      - name: origin
        type: string
        required: false